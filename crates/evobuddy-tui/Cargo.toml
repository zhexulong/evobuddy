[package]
name = "evobuddy-tui"
version = "0.1.0"
edition = "2021"

[lib]
name = "evobuddy_tui"
path = "src/lib.rs"

[[bin]]
name = "evobuddy-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
